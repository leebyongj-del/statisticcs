<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>우리반 통계 실험실</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0}
img{max-width:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
/* Layout: 모눈종이 위에 놓인 교과서 탐구 활동지 — 상단 단원 탭, 한 열짜리 활동 카드 */
:root{
  --bg:#F2F5F3; --paper:#FFFFFF; --ink:#16232C; --muted:#56666D; --line:#D3DCD8; --grid:#E3EAE6;
  --accent:#1D6F55; --accent-ink:#FFFFFF; --accent-soft:#DCEEE6;
  --a:#2C58C4; --a-soft:#E2E9FA; --b:#C44C2C; --b-soft:#F7E2DA;
  --hl:#FFE47A; --hl-ink:#4D3B00; --warn:#9A5B00; --warn-soft:#FBEFD9;
  --f-display:"Do Hyeon","IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0F1715; --paper:#16211E; --ink:#E5EEEA; --muted:#98AAA3; --line:#2B3A35; --grid:#1B2724;
  --accent:#5BC49B; --accent-ink:#0B1A14; --accent-soft:#1C3A2F;
  --a:#86A6FF; --a-soft:#1E2A47; --b:#FF8E6D; --b-soft:#45261C;
  --hl:#5E5012; --hl-ink:#FFF2BD; --warn:#F2B661; --warn-soft:#3A2C14; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0F1715; --paper:#16211E; --ink:#E5EEEA; --muted:#98AAA3; --line:#2B3A35; --grid:#1B2724;
  --accent:#5BC49B; --accent-ink:#0B1A14; --accent-soft:#1C3A2F;
  --a:#86A6FF; --a-soft:#1E2A47; --b:#FF8E6D; --b-soft:#45261C;
  --hl:#5E5012; --hl-ink:#FFF2BD; --warn:#F2B661; --warn-soft:#3A2C14; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;background-attachment:fixed}
.wrap{max-width:1060px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 60px}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 20px;margin-bottom:14px}
h1{font-family:var(--f-display);font-weight:400;font-size:2.1rem;line-height:1.1;margin:0;letter-spacing:.01em}
h1 small{display:block;font-family:var(--f-body);font-size:.9rem;color:var(--muted);letter-spacing:0;margin-top:6px}
.live{font-size:.85rem;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.dot.on{background:var(--accent)}
nav.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:2px solid var(--ink);margin-bottom:16px;scrollbar-width:thin}
nav.tabs button{flex:0 0 auto;font:inherit;font-size:.95rem;border:0;background:transparent;color:var(--muted);padding:10px 14px 9px;cursor:pointer;border-radius:8px 8px 0 0;white-space:nowrap}
nav.tabs button:hover{color:var(--ink);background:var(--paper)}
nav.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg);font-weight:700}
nav.tabs .unit{font-family:var(--f-num);font-size:.75rem;opacity:.7;margin-right:6px}
button,select,input,textarea{font:inherit}
:focus-visible{outline:3px solid var(--a);outline-offset:2px}
.toolbar{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:16px}
.toolbar label{display:flex;align-items:center;gap:8px;font-size:.9rem;color:var(--muted);min-width:0}
select,input[type=number],input[type=text],textarea{background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:7px 10px;max-width:100%}
select{min-width:0}
textarea{width:100%;font-family:var(--f-num);font-size:.92rem}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:4px 12px;cursor:pointer;font-size:.9rem}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.count{margin-left:auto;font-family:var(--f-num);font-size:.9rem;color:var(--muted)}
.stack{display:grid;gap:16px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:18px 20px;min-width:0}
.card h2{font-family:var(--f-display);font-weight:400;font-size:1.5rem;margin:0 0 8px;line-height:1.25;text-wrap:balance}
.card h3{font-size:1.05rem;margin:14px 0 6px}
.lead{color:var(--muted);margin:0 0 10px;max-width:68ch}
.eyebrow{font-size:.75rem;letter-spacing:.08em;color:var(--accent);font-weight:700}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.rep{border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:var(--bg);display:flex;flex-direction:column;gap:6px;min-width:0}
.rep.best{border:2px solid var(--accent);background:var(--accent-soft)}
.rep .name{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:700}
.big{font-family:var(--f-num);font-size:2rem;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.big small{font-size:1rem;font-weight:400;color:var(--muted);margin-left:4px}
.calc{font-family:var(--f-num);font-size:.88rem;color:var(--muted);overflow-wrap:anywhere}
.badge{font-size:.75rem;font-weight:700;border-radius:999px;padding:2px 9px;white-space:nowrap}
.badge.good{background:var(--accent);color:var(--accent-ink)}
.badge.mid{background:var(--warn-soft);color:var(--warn)}
.badge.bad{background:var(--line);color:var(--muted)}
.badge.ex{background:var(--warn-soft);color:var(--warn)}
.badge.live{background:var(--accent-soft);color:var(--accent)}
.verdict{border-left:6px solid var(--accent);background:var(--accent-soft);border-radius:0 12px 12px 0;padding:14px 18px}
.verdict .title{font-family:var(--f-display);font-size:1.4rem;line-height:1.3}
ol.reasons,ol.steps{margin:8px 0 0;padding-left:1.4em;display:grid;gap:6px}
ol.steps li::marker{font-family:var(--f-num);font-weight:600;color:var(--accent)}
.vals{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0}
.v{font-family:var(--f-num);font-size:.92rem;padding:2px 8px;border-radius:6px;background:var(--bg);border:1px solid var(--line);font-variant-numeric:tabular-nums;position:relative}
.v.med{background:var(--hl);color:var(--hl-ink);border-color:var(--hl);font-weight:600}
.v.mode{outline:2px solid var(--a);outline-offset:-2px}
.v.ext{background:var(--b-soft);color:var(--b);border-color:var(--b);font-weight:600}
.v.ga{border-bottom:3px solid var(--a)} .v.gb{border-bottom:3px solid var(--b)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:.82rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.sw{width:14px;height:14px;border-radius:4px;display:inline-block;border:1px solid var(--line)}
.scroll{overflow-x:auto}
table.t{border-collapse:collapse;min-width:100%;font-variant-numeric:tabular-nums}
table.t th,table.t td{border:1px solid var(--ink);padding:7px 14px;text-align:center}
table.t thead th{background:var(--accent-soft);font-weight:700}
table.t tfoot td{font-weight:700;background:var(--bg)}
table.t td.num{font-family:var(--f-num)}
table.t td.tally{font-size:1.05rem;letter-spacing:.1em;text-align:left}
table.t tr.hot td{background:var(--hl);color:var(--hl-ink)}
.stem{border-collapse:collapse;font-family:var(--f-num);font-size:1.3rem}
.stem td{padding:4px 14px;vertical-align:top}
.stem td.s{text-align:right;border-right:2px solid var(--ink);font-weight:600}
.stem td.l{letter-spacing:.35em;white-space:nowrap}
.stem th{font-family:var(--f-body);font-size:.85rem;color:var(--muted);font-weight:500;padding:0 14px 6px;border-bottom:2px solid var(--ink)}
.stem th:first-child{border-right:2px solid var(--ink)}
.key{font-family:var(--f-num);font-size:.95rem;margin-top:8px}
.crit{display:grid;gap:8px}
.crit .row{display:grid;grid-template-columns:minmax(120px,190px) 1fr auto;gap:10px;align-items:start;padding:10px 12px;border-radius:10px;background:var(--bg);border:1px solid var(--line)}
.crit .row b{font-size:.92rem}
.crit .row .why{font-size:.9rem;color:var(--muted);min-width:0}
@media (max-width:560px){.crit .row{grid-template-columns:1fr}}
svg.chart{width:100%;height:auto;display:block;max-width:100%}
svg .ax{stroke:var(--ink);stroke-width:1.5}
svg .gl{stroke:var(--line);stroke-width:1}
svg .tx{fill:var(--ink);font-family:var(--f-num);font-size:13px}
svg .tm{fill:var(--muted);font-family:var(--f-body);font-size:13px}
svg .bar{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.5}
svg .ghost{fill:none;stroke:var(--muted);stroke-width:1.2;stroke-dasharray:5 4}
svg .lbl{fill:var(--accent);font-family:var(--f-num);font-size:13px;font-weight:600}
.stepper{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:6px 0 10px}
.stepper .chip{font-size:.85rem}
.note{font-size:.88rem;color:var(--muted)}
.banner{border-radius:12px;padding:12px 16px;margin-bottom:16px;background:var(--warn-soft);color:var(--ink);border:1px solid var(--line)}
.banner b{color:var(--warn)}
.btn{border:0;background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:9px 16px;font-weight:700;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--b);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:.88rem;color:var(--muted);min-width:0}
.form .wide{grid-column:1/-1}
.row-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.survey-item{border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:var(--bg);display:grid;gap:10px}
.ans-q{font-family:var(--f-display);font-size:1.9rem;line-height:1.25;margin:6px 0 12px}
.ans-input{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ans-input input{font-family:var(--f-num);font-size:2rem;width:min(220px,100%);padding:8px 12px}
.ans-input .u{font-size:1.4rem}
.msg{font-weight:700;color:var(--accent)} .msg.err{color:var(--b)}
.mini{font-size:.8rem}
.cmpkey{display:flex;gap:16px;flex-wrap:wrap;font-weight:700}
.cmpkey .a{color:var(--a)} .cmpkey .b{color:var(--b)}
td.ca{color:var(--a);font-family:var(--f-num)} td.cb{color:var(--b);font-family:var(--f-num)}
.insight{background:var(--hl);color:var(--hl-ink);border-radius:12px;padding:12px 16px;font-weight:500}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
@media (max-width:720px){.split{grid-template-columns:1fr}}
.hdr-right{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
.who{display:flex;align-items:center;gap:8px;font-size:.85rem}
.who .role{font-weight:700;border-radius:999px;padding:3px 10px;background:var(--accent-soft);color:var(--accent)}
.who button{font:inherit;font-size:.82rem;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:3px 10px;cursor:pointer}
.roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin-top:8px}
.role-card{text-align:left;font:inherit;color:var(--ink);background:var(--paper);border:2px solid var(--line);border-radius:18px;padding:26px 24px;cursor:pointer;display:flex;flex-direction:column;gap:8px;min-width:0}
.role-card:hover{border-color:var(--accent)}
.role-card .r-name{font-family:var(--f-display);font-size:2.2rem;line-height:1.1}
.role-card .r-desc{color:var(--muted)}
.role-card .r-go{margin-top:6px;font-weight:700;color:var(--accent)}
.role-card.st .r-name{color:var(--a)} .role-card.st:hover{border-color:var(--a)} .role-card.st .r-go{color:var(--a)}
.pin{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:6px}
.pin input{font-family:var(--f-num);font-size:1.8rem;letter-spacing:.3em;width:min(240px,100%);padding:8px 12px;text-align:center}
.welcome{font-family:var(--f-display);font-size:2rem;line-height:1.25;margin:4px 0 6px}
.q-form{display:grid;gap:18px}
.q-step{display:grid;gap:8px}
.q-label{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.05rem}
.q-num{font-family:var(--f-num);width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--bg);display:inline-grid;place-items:center;font-size:.9rem}
.q-step .chip{font-size:1.05rem;padding:8px 18px}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.opts .chip.opt{font-family:var(--f-num);font-size:1.05rem;padding:10px 6px;border-radius:10px;text-align:center}
.ans-input.small input{font-size:1.4rem;width:110px}
.big-btn{font-size:1.1rem;padding:12px 28px}
.share{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;border-radius:12px;padding:10px 14px;margin-bottom:14px;background:var(--paper);border:1px dashed var(--line)}
.share.on{background:var(--a-soft);border:2px solid var(--a)}
.share b{font-size:.95rem}
.share-what{font-weight:500;min-width:0;overflow-wrap:anywhere}
.share-act{margin-left:auto}
.share-hint{flex-basis:100%}
.share-dot{width:10px;height:10px;border-radius:50%;background:var(--a);display:inline-block}
@media (prefers-reduced-motion:no-preference){ .share-dot{animation:blink 1.6s ease-in-out infinite} @keyframes blink{50%{opacity:.25}} }
@media (prefers-reduced-motion:no-preference){ svg .anim{transition:opacity .3s} }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>우리반 통계 실험실<small>중학교 1학년 · 자료의 정리와 해석</small></h1>
    <div class="hdr-right"><div class="live" id="live"><span class="dot"></span><span>연결 확인 중</span></div><div id="who"></div></div>
  </header>
  <nav class="tabs" id="tabs" role="tablist"></nav>
  <div id="share"></div>
  <div id="banner"></div>
  <div id="toolbar"></div>
  <main id="main" class="stack"></main>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>/* 설정 파일은 캐시를 쓰지 않고 항상 새로 받아요 */ document.write('<script src="firebase-config.js?v=' + Date.now() + '"><\/script>');</script>
<script>
/* ---------- 예시 자료 (수업 시연용, 실제 학생 자료 아님) ---------- */
const ex = (g, arr) => arr.map((v, i) => ({ v, g, s: i % 2 ? '여' : '남' }));
const exc = (g, obj) => ex(g, Object.entries(obj).flatMap(([k, n]) => Array(n).fill(k)));
const MBTI = ['ISTJ','ISFJ','INFJ','INTJ','ISTP','ISFP','INFP','INTP','ESTP','ESFP','ENFP','ENTP','ESTJ','ESFJ','ENFJ','ENTJ'];
const SUBJECTS = ['국어','영어','수학','과학','사회','체육','음악','미술','기술·가정','정보'];
const SAMPLES = [
  { id:'ex-jump', sample:true, title:'1분 동안 줄넘기 횟수', unit:'회', decimals:0, kind:'measure', groups:['1반','2반'],
    values:[...ex('1반',[68,75,79,82,85,88,91,93,95,96,98,101,103,104,107,109,112,114,118,121,125,129,134,142]),
            ...ex('2반',[62,66,71,73,77,78,81,83,84,86,87,89,90,92,94,95,97,99,100,102,105,106,108,110,113,115,117,120,123,127,131,138])] },
  { id:'ex-commute', sample:true, title:'등교하는 데 걸리는 시간', unit:'분', decimals:0, kind:'measure', groups:[],
    values:ex('',[5,7,8,8,10,10,10,12,12,13,15,15,15,15,18,20,20,25,70,85]) },
  { id:'ex-shoe', sample:true, title:'신발 크기', unit:'mm', decimals:0, kind:'choice', groups:[],
    values:ex('',[225,230,230,230,235,235,235,235,240,240,240,240,240,240,240,245,245,245,245,245,250,250,250,255,255,260]) },
  { id:'ex-mbti', sample:true, title:'나의 MBTI', unit:'', type:'category', options:MBTI, kind:'choice', groups:['1반','2반'],
    values:[...exc('1반',{ENFP:4,INFP:3,ISFJ:3,ESFJ:2,INTP:2,ENTP:2,ISTJ:2,ESTP:1,INFJ:1,ENFJ:2,ISFP:2}),
            ...exc('2반',{ENFP:4,ISFP:4,INFP:3,ESTJ:3,ISTJ:3,ESFP:2,INTJ:2,ENTJ:1,ISFJ:2,ESFJ:2,ISTP:2})] },
];
const PRESETS = [
  { title:'1분 동안 줄넘기 횟수', unit:'회', decimals:0, min:0, max:300, kind:'measure' },
  { title:'하루 평균 수면 시간', unit:'시간', decimals:1, min:0, max:15, kind:'measure' },
  { title:'등교하는 데 걸리는 시간', unit:'분', decimals:0, min:0, max:180, kind:'measure' },
  { title:'신발 크기', unit:'mm', decimals:0, min:180, max:320, kind:'choice' },
  { title:'키', unit:'cm', decimals:1, min:100, max:200, kind:'measure' },
  { title:'나의 MBTI', unit:'', type:'category', options:MBTI, kind:'choice' },
  { title:'가장 좋아하는 과목', unit:'', type:'category', options:SUBJECTS, kind:'choice' },
];

/* ---------- 상태 ---------- */
const TABS = [
  ['submit','응답하기',''],['data','자료','1'],['rep','대푯값','2'],['stem','줄기와 잎 그림','3'],
  ['table','도수분포표','4'],['graph','히스토그램·다각형','5'],['rel','상대도수','6'],['admin','설문 관리','']
];
const S = {
  db:null, user:null, uid:null, canEdit:false, canWrite:null, dbState:'loading',
  surveys:{}, answers:[], cur:'ex-jump', group:'전체', width:{}, tab:null,
  step:5, polyOnly:false, whatIf:null, cmpA:null, cmpB:null, cmpMode:'count', thr:null,
  submitSid:null, submitGroup:null, submitMsg:null, confirm:null, adminMsg:null, tally:true,
  local:{ title:'직접 입력한 자료', unit:'', kind:'measure', values:[] },
  role:null, pinMsg:null, shown:null, shareMsg:null, sex:'전체', cmpBy:'g', submitSex:null, submitCat:null, nvType:'number', thrCat:null
};
const PIN_HASH = '5dbbc229315d3018c570ed53839b01ec6bcceb25838e2f2f35c85890db7fe24e';
try { const r = localStorage.getItem('statlab-role'); if (r === 'teacher' || r === 'student') S.role = r; } catch(e) {}
function setRole(r){ S.role = r; try { r ? localStorage.setItem('statlab-role', r) : localStorage.removeItem('statlab-role'); } catch(e) {} }
async function checkPin(pin){
  try { const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(pin));
    return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2,'0')).join('') === PIN_HASH;

function stats(vals){
  const a = [...vals].sort((x,y) => x - y), n = a.length;
  if (!n) return { n:0, a };
  const sum = R(a.reduce((s,x) => s + x, 0)), mean = sum / n;

  const cnt = new Map(); a.forEach(x => cnt.set(x, (cnt.get(x)||0) + 1));
  const maxC = Math.max(...cnt.values());
  const allSame = [...cnt.values()].every(c => c === maxC);
  const modes = (allSame && cnt.size > 1) ? [] : [...cnt.entries()].filter(([,c]) => c === maxC).map(([v]) => v);
  const half = Math.floor(n/2);
  const med = arr => arr.length % 2 ? arr[(arr.length-1)/2] : (arr[arr.length/2-1] + arr[arr.length/2]) / 2;
  const q1 = n >= 4 ? med(a.slice(0, half)) : a[0], q3 = n >= 4 ? med(a.slice(n - half)) : a[n-1];
  const iqr = q3 - q1;
  const ext = (n >= 6 && iqr > 0) ? a.filter(x => x < q1 - 1.5*iqr || x > q3 + 1.5*iqr) : [];
  return { n, a, sum, mean, median, cnt, maxC, modes, min:a[0], max:a[n-1], ext };
}

function niceWidths(d){

function stemLeaf(vals, d){

function niceStep(max, rel){

function chart(o){

    g += `<text class="tx" x="${ml-8}" y="${Y(t)+4}" text-anchor="end">${fmt(t,2)}</text>`;

  const bounds = [...cls.map(c => c.lo), cls[cls.length-1].hi];
  bounds.forEach(b => { g += `<line class="ax" x1="${X(b)}" x2="${X(b)}" y1="${H-mb}" y2="${H-mb+5}"/><text class="tx" x="${X(b)}" y="${H-mb+21}" text-anchor="middle">${fmt(b,2)}</text>`; });

      if (step < 3 || !o.showPoly) g += `<text class="lbl" x="${(X(c.lo)+X(c.hi))/2}" y="${Y(y)-6}" text-anchor="middle">${rel ? fmt(y,2) : y}</text>`;

      }

      if (step >= 3) all.forEach(p => { g += `<circle cx="${p[0]}" cy="${p[1]}" r="5" fill="${s.color}" stroke="var(--paper)" stroke-width="1.5"/>`; });
      if (step >= 5 && (!bars || ser.length > 1)) cls.forEach((c,i) => { if (s.y[i] > 0 && ser.length === 1) g += `<text class="lbl" x="${pts[i][0]}" y="${pts[i][1]-10}" text-anchor="middle">${rel ? fmt(s.y[i],2) : s.y[i]}</text>`; });

  g += `<text class="tm" x="${W-mr}" y="${H-12}" text-anchor="end">(${esc(unit || '변량')})</text>`;
  g += `<text class="tm" x="${ml-6}" y="${mt-12}" text-anchor="start">${esc(ylab || (rel ? '(상대도수)' : '(도수)'))}</text>`;

}

  if (gs.length && S.submitGroup && !gs.includes(S.submitGroup)) S.submitGroup = null;
  const d = s.decimals || 0;
  const readonly = S.canWrite === false;
  const step = (n, label, body) => `<div class="q-step"><div class="q-label"><span class="q-num">${n}</span>${label}</div>${body}</div>`;
  const classPart = gs.length
    ? `<div class="chips">${gs.map(g => `<button type="button" class="chip" data-submit-group="${esc(g)}" aria-pressed="${S.submitGroup===g}">${esc(g)}</button>`).join('')}</div>`
    : `<div class="ans-input small"><input id="ans-class" type="number" min="1" max="30" inputmode="numeric" placeholder="예: 3" value="${S.submitGroup ? parseInt(S.submitGroup,10) || '' : ''}" aria-label="반 번호" ${readonly?'disabled':''}><span class="u">반</span></div>`;
  const sexPart = `<div class="chips">${SEXES.map(x => `<button type="button" class="chip" data-submit-sex="${x}" aria-pressed="${S.submitSex===x}">${sexLabel(x)}</button>`).join('')}</div>`;
  const valPart = cat
    ? `<div class="opts">${(s.options||[]).map(o => `<button type="button" class="chip opt" data-submit-cat="${esc(o)}" aria-pressed="${S.submitCat===o}">${esc(o)}</button>`).join('')}</div><p class="note">보기에서 하나를 골라 주세요.</p>`
    : `<div class="ans-input"><input id="ans-val" type="number" inputmode="decimal" step="${Math.pow(10,-d)}" ${s.min!=null&&s.min!==''?`min="${s.min}"`:''} ${s.max!=null&&s.max!==''?`max="${s.max}"`:''} placeholder="${d? '예: 7.5':'숫자'}" aria-label="내 값" ${readonly?'disabled':''}><span class="u">${esc(s.unit)}</span></div>
       <p class="note">${d ? `소수 ${d}째 자리까지 쓸 수 있어요.` : '자연수로 써 주세요.'}</p>`;
  return `<section class="card">
    ${open.length > 1 ? `<div class="chips" style="margin-bottom:10px">${open.map(x => `<button class="chip" data-submit-sid="${esc(x.id)}" aria-pressed="${x.id===s.id}">${esc(x.title)}</button>`).join('')}</div>` : ''}
    <div class="eyebrow">오늘의 설문</div>
    <div class="ans-q">${esc(s.title)}${s.unit ? ` <span class="note">(단위: ${esc(s.unit)})</span>` : ''}</div>
    <form id="ans-form" class="q-form">
      ${step(1, gs.length ? '우리 반을 골라 주세요' : '몇 반인지 써 주세요', classPart)}
      ${step(2, '성별을 골라 주세요', sexPart)}
      ${step(3, cat ? '나의 답을 골라 주세요' : '나의 값을 써 주세요', valPart)}
      <div class="row-actions"><button class="btn big-btn" type="submit" ${readonly?'disabled':''}>${myOk ? '다시 내기' : '내기'}</button><span class="note">이름은 저장되지 않아요.</span></div>
    </form>
    ${readonly ? `<p class="msg err">이 링크로는 볼 수만 있어서 응답을 낼 수 없어요. 선생님께 알려 주세요.</p>` : ''}
    ${myOk ? `<p class="msg">내가 낸 답: ${dv(my.v)}${cat?'':esc(s.unit)}${my.g?` · ${esc(my.g)}`:''}${my.s?` · ${sexLabel(my.s)}`:''} — 다시 내면 이 답이 바뀌어요.</p>` : ''}
    ${S.submitMsg ? `<p class="msg ${S.submitMsg.err?'err':''}">${esc(S.submitMsg.t)}</p>` : ''}
  </section>
  ${shownTab() ? `<section class="card verdict"><div class="eyebrow">선생님 화면</div><div class="title">선생님이 ‘${esc(tabLabel(shownTab()))}’ 화면을 열었어요</div><div style="margin-top:10px"><button class="btn" data-tab="${shownTab()}">보러 가기</button></div></section>` : ''}
  <section class="card"><h2>지금까지 모인 응답</h2><p class="lead">응답 ${rowsOf(s).length}개가 모였어요. 선생님 화면에서 함께 분석해요.</p></section>`;
}

  const badge = s.sample ? `<span class="badge ex">예시 자료</span>` : s.local ? `<span class="badge ex">직접 입력 · 이 기기에만 저장</span>` : `<span class="badge live">실시간 설문</span>`;

      <div class="form">
        <label>자료 이름<input id="loc-title" type="text" value="${esc(S.local.title)}"></label>

        <label>자료의 성격<select id="loc-kind"><option value="measure" ${S.local.kind!=='choice'?'selected':''}>재거나 센 값 (키, 시간, 횟수)</option><option value="choice" ${S.local.kind==='choice'?'selected':''}>가장 많은 값이 중요한 자료 (신발·옷 크기)</option></select></label>
        <label class="wide">값<textarea id="loc-text" rows="6" placeholder="1반, 남, 72&#10;1반, 여, 85&#10;2반, 남, 90">${esc(S.local.values.map(r => (r.g? r.g+', ':'') + (r.s? r.s+', ':'') + r.v).join('\n'))}</textarea></label>

/* ---------- 탭: 대푯값 ---------- */
function recommendRep(s, st){
  const u = unitOf(s);
  const extMsg = st.ext.length ? st.ext.map(x=>fmt(x,2)).join(', ') : '';
  const gap = Math.abs(st.mean - st.median), range = st.max - st.min || 1;
  const skew = gap / range > 0.08;
  const below = st.a.filter(x => x < st.mean).length;
  const modeShare = st.modes.length ? st.maxC / st.n : 0;
  let pick, reasons = [], notes = {};
  if (s.kind === 'choice') {
    pick = 'mode';
    reasons.push(`‘${esc(s.title)}’은(는) 가장 많은 사람이 고른 값이 중요한 자료예요. 예를 들어 매점에서 가장 많이 준비해야 할 크기를 정할 때 쓰여요.`);
    reasons.push(`평균 ${meanText(st.mean)}${u}는 실제로는 없는 값일 수 있어요. 자료에 있는 값으로 대표하는 것이 자연스러워요.`);
    if (st.modes.length) reasons.push(`최빈값 ${st.modes.map(x=>fmt(x,2)).join(', ')}${u}은(는) ${st.n}개 중 ${st.maxC}개로 가장 많이 나타났어요.`);
    else reasons.push(`다만 지금 자료는 모든 값의 도수가 같아서 최빈값이 없어요. 자료가 더 모이면 다시 확인해 보세요.`);
  } else if (st.ext.length || skew) {
    pick = 'median';
    if (st.ext.length) reasons.push(`<b>${extMsg}</b>처럼 다른 값들과 동떨어진 <b>극단적인 값</b>이 있어요.`);
    reasons.push(`평균(${meanText(st.mean)}${u})이 중앙값(${fmt(st.median,2)}${u})보다 ${st.mean > st.median ? '크게' : '작게'} 끌려갔어요. 평균보다 작은 값이 ${st.n}개 중 ${below}개라서 평균이 ‘가운데’를 잘 나타내지 못해요.`);
    if (st.ext.length) { const rest = st.a.filter(x => !st.ext.includes(x)); const m2 = rest.reduce((a,b)=>a+b,0)/rest.length; reasons.push(`극단적인 값을 빼고 평균을 다시 구하면 ${meanText(m2)}${u}예요. 평균은 극단적인 값 몇 개에 크게 흔들리지만, 중앙값은 거의 변하지 않아요.`); }
    reasons.push(`중앙값은 값들을 크기순으로 늘어놓았을 때 한가운데 값이라 극단적인 값의 영향을 덜 받아요.`);
  } else {
    pick = 'mean';
    reasons.push(`극단적으로 크거나 작은 값이 없고, 값들이 ${fmt(st.min,2)}${u}부터 ${fmt(st.max,2)}${u}까지 비교적 고르게 퍼져 있어요.`);
    reasons.push(`평균(${meanText(st.mean)}${u})과 중앙값(${fmt(st.median,2)}${u})의 차이가 ${fmt(gap,2)}${u}로 작아요.`);
    reasons.push(`평균은 모든 변량을 빠짐없이 계산에 넣기 때문에, 이런 자료에서는 전체를 가장 잘 대표해요.`);
    if (st.modes.length && modeShare < 0.25) reasons.push(`최빈값은 ${st.n}개 중 ${st.maxC}개만 가진 값이라 자료 전체를 대표하기에는 약해요.`);
  }
  notes.mean = pick==='mean' ? ['good','추천'] : (pick==='median' ? ['bad','극단적인 값에 약함'] : ['mid','실제 없는 값일 수 있음']);
  notes.median = pick==='median' ? ['good','추천'] : (pick==='mean' ? ['mid','쓸 수 있음'] : ['mid','쓸 수 있음']);
  notes.mode = pick==='mode' ? ['good','추천'] : (!st.modes.length ? ['bad','최빈값 없음'] : (modeShare >= 0.25 ? ['mid','참고할 만함'] : ['bad','대표성 약함']));
  return { pick, reasons, notes };
}
function viewRepNum(){
  const s = curSurvey(); const rows = filtered(s); const st = stats(rows.map(r=>r.v)); const u = unitOf(s);
  if (!st.n) return emptyCard(s);
  const rec = recommendRep(s, st);
  const n = st.n, odd = n % 2 === 1;
  const medIdx = odd ? [(n-1)/2] : [n/2-1, n/2];
  const chips = st.a.map((x,i) => `<span class="v ${medIdx.includes(i)?'med':''} ${st.modes.includes(x)?'mode':''} ${st.ext.includes(x)?'ext':''}">${fmt(x,2)}</span>`).join('');
  const meanCalc = n <= 12 ? `(${st.a.map(x=>fmt(x,2)).join(' + ')}) ÷ ${n}` : `(변량의 총합 ${fmt(st.sum,2)}) ÷ (변량의 개수 ${n})`;
  const medCalc = odd ? `${n}개(홀수) → ${(n+1)/2}번째 값` : `${n}개(짝수) → ${n/2}번째와 ${n/2+1}번째 값의 평균: (${fmt(st.a[n/2-1],2)} + ${fmt(st.a[n/2],2)}) ÷ 2`;
  const modeCalc = st.modes.length ? `가장 많이 나타난 값 · ${st.maxC}번` : `모든 값의 도수가 같아요`;
  const card = (key, name, val, calc) => `<div class="rep ${rec.pick===key?'best':''}"><div class="name">${name}<span class="badge ${rec.notes[key][0]}">${rec.notes[key][1]}</span></div><div class="big">${val}<small>${esc(u)}</small></div><div class="calc">${calc}</div></div>`;
  const pickName = { mean:'평균', median:'중앙값', mode:'최빈값' }[rec.pick];
  let wi = '';
  if (S.whatIf != null && isFinite(S.whatIf)) {
    const st2 = stats([...st.a, S.whatIf]);
    const dm = st2.mean - st.mean, dmed = st2.median - st.median;
    wi = `<div class="split" style="margin-top:12px">
      <div class="rep"><div class="name">평균</div><div class="big">${fmt(st.mean,2)} → ${fmt(st2.mean,2)}</div><div class="calc">${dm>=0?'+':''}${fmt(dm,2)}${esc(u)} 움직였어요</div></div>
      <div class="rep"><div class="name">중앙값</div><div class="big">${fmt(st.median,2)} → ${fmt(st2.median,2)}</div><div class="calc">${dmed>=0?'+':''}${fmt(dmed,2)}${esc(u)} 움직였어요</div></div></div>
      <p class="insight" style="margin-top:12px">값 ${fmt(S.whatIf,2)}${esc(u)} 하나를 더했더니 평균은 ${fmt(Math.abs(dm),2)}${esc(u)}, 중앙값은 ${fmt(Math.abs(dmed),2)}${esc(u)} 변했어요. ${Math.abs(dm) > Math.abs(dmed) ? '평균이 극단적인 값에 더 크게 흔들린다는 것을 알 수 있어요.' : '이 값은 극단적인 값이 아니어서 둘 다 조금만 변했어요. 아주 큰 값을 넣어 보세요.'}</p>`;
  }
  return `
  <section class="card">
    <div class="eyebrow">대푯값 · 자료 전체의 특징을 하나의 수로 나타낸 값</div>
    <h2>${esc(s.title)}${scopeLabel()}의 대푯값</h2>
    <div class="grid3">
      ${card('mean','평균', meanText(st.mean), meanCalc + ` = ${fmt(st.mean,3)}`)}
      ${card('median','중앙값', fmt(st.median,2), medCalc)}
      ${card('mode','최빈값', st.modes.length ? st.modes.map(x=>fmt(x,2)).join(', ') : '없음', modeCalc)}
    </div>
  </section>
  <section class="card verdict">
    <div class="eyebrow">이 자료에는</div>
    <div class="title">${pickName}을(를) 대푯값으로 고르는 것이 알맞아요</div>
    <ol class="reasons">${rec.reasons.map(r=>`<li>${r}</li>`).join('')}</ol>
  </section>
  <section class="card">
    <h2>크기순으로 늘어놓은 변량</h2>
    <div class="legend"><span><i class="sw" style="background:var(--hl)"></i>중앙값 자리</span><span><i class="sw" style="outline:2px solid var(--a);outline-offset:-2px"></i>최빈값</span><span><i class="sw" style="background:var(--b-soft);border-color:var(--b)"></i>극단적인 값</span></div>
    <div class="vals">${chips}</div>
  </section>
  <section class="card">
    <h2>극단적인 값을 하나 넣어 보면?</h2>
    <p class="lead">아주 크거나 작은 값을 하나 더 넣고 평균과 중앙값이 얼마나 변하는지 비교해 보세요. 원래 자료는 바뀌지 않아요.</p>
    <div class="row-actions"><input id="whatif" type="number" step="any" placeholder="예: ${fmt(st.max*3,0)}" aria-label="넣어 볼 값" style="width:160px"> <span>${esc(u)}</span>
      <button class="btn" data-act="whatif">넣어 보기</button>${S.whatIf!=null?`<button class="btn ghost" data-act="whatif-clear">지우기</button>`:''}</div>
    ${wi}
  </section>
  <section class="card">
    <h2>교과서로 정리하기</h2>
    <div class="grid3">
      <div><h3>평균</h3><p class="note">(평균) = (변량의 총합) ÷ (변량의 개수). 모든 변량을 반영하지만 극단적인 값의 영향을 크게 받아요.</p></div>
      <div><h3>중앙값</h3><p class="note">변량을 작은 값부터 크기순으로 나열할 때 한가운데 있는 값. 변량의 개수가 홀수이면 가운데 값, 짝수이면 가운데 두 값의 평균이에요. 극단적인 값이 있을 때 알맞아요.</p></div>
      <div><h3>최빈값</h3><p class="note">자료에서 가장 많이 나타나는 값. 여러 개일 수도 있어요. 신발 크기처럼 수량이 아닌 선호를 알아볼 때도 쓸 수 있어요.</p></div>
    </div>
  </section>`;
}

/* ---------- 줄기와 잎 vs 도수분포표 안내 ---------- */
function organizeAdvice(s, vals){
  const d = s.decimals || 0, n = vals.length;
  const sl = stemLeaf(vals, d); const k = sl.rows.length;
  const crit = [];
  crit.push({ q:'자료의 개수', val:`${n}개`, pick: n <= 30 ? 'stem' : 'table',
    why: n <= 30 ? '개수가 많지 않아 잎을 하나하나 써도 한눈에 들어와요.' : '개수가 많아 잎을 모두 쓰면 줄이 너무 길어져요. 구간으로 묶는 편이 보기 쉬워요.' });
  crit.push({ q:'줄기의 개수', val:`${k}개`, pick: (k >= 3 && k <= 12) ? 'stem' : 'table',
    why: k < 3 ? '줄기가 너무 적으면 잎이 한 줄에 몰려서 분포가 잘 보이지 않아요.' : k > 12 ? '줄기가 너무 많으면 그림이 길어지고 듬성듬성해져요.' : '줄기 수가 알맞아 분포 모양이 잘 드러나요.' });
  crit.push({ q:'값의 자릿수', val: d > 1 ? `소수 ${d}째 자리` : d === 1 ? '소수 첫째 자리' : '자연수',
    pick: d > 1 ? 'table' : 'stem', why: d > 1 ? '자릿수가 많으면 줄기와 잎으로 나누기 어려워요.' : '줄기와 잎으로 나누기 쉬운 값이에요.' });

  if (!ins) ins = nA !== nB ? `두 집단의 전체 인원이 ${nA}명과 ${nB}명으로 달라요. 도수만 보면 인원이 많은 집단이 대부분 더 커 보이기 쉬워요.` : `두 집단의 인원이 같아서 지금은 도수와 상대도수의 비교 결과가 같아요. 인원이 다른 집단에서 차이가 드러나요.`;
  // 질문
  let qSel, kA, kB, qText;
  if (cat) {
    const present = bins.filter((b,i) => cA[i] + cB[i] > 0);
    if (!present.includes(S.thrCat)) S.thrCat = present[0];
    qSel = `<select id="thr-cat">${present.map(b => `<option ${b===S.thrCat?'selected':''}>${esc(b)}</option>`).join('')}</select>`;
    kA = A.filter(v => v === S.thrCat).length; kB = B.filter(v => v === S.thrCat).length;
    qText = `${qSel}을(를) 고른 학생은 어느 집단에 더 많을까?`;
  } else {
    const bnd = cls.slice(1).map(c => c.lo);
    if (!bnd.includes(S.thr)) S.thr = bnd[Math.floor(bnd.length/2)] ?? cls[0].lo;
    qSel = `<select id="thr">${bnd.map(b => `<option value="${b}" ${b===S.thr?'selected':''}>${fmt(b,2)}</option>`).join('')}</select>`;
    kA = A.filter(v => v >= S.thr).length; kB = B.filter(v => v >= S.thr).length;
    qText = `${esc(s.title)}이(가) ${qSel}${esc(u)} 이상인 학생은 어느 집단에 더 많을까?`;
  }
  const pick = (id, cur, oth) => `<select id="${id}">${C.keys.map(g => `<option value="${esc(g)}" ${g===cur?'selected':''} ${g===oth?'disabled':''}>${esc(K(g))}</option>`).join('')}</select>`;
  const scope = dim === 'g' ? (S.sex !== '전체' ? ` (${sexLabel(S.sex)}만)` : '') : (S.group !== '전체' ? ` (${esc(S.group)}만)` : '');
  return intro + `
    <div class="row-actions" style="margin-bottom:10px">
      ${canG && canS ? `<div class="chips"><button class="chip" data-cmpby="g" aria-pressed="${dim==='g'}">반끼리 비교</button><button class="chip" data-cmpby="s" aria-pressed="${dim==='s'}">남녀 비교</button></div>` : ''}
      <span class="cmpkey"><span class="a">● ${pick('cmp-a', S.cmpA, S.cmpB)} ${nA}명</span><span class="b">● ${pick('cmp-b', S.cmpB, S.cmpA)} ${nB}명</span></span><span class="note">${scope}</span>
      <div class="chips"><button class="chip" data-cmp="count" aria-pressed="${!rel}">도수로 비교</button><button class="chip" data-cmp="rel" aria-pressed="${rel}">상대도수로 비교</button></div>
    </div>
    <div class="split">
      <div class="scroll">${svg}<p class="note">${rel ? '세로축: 상대도수 — 전체 인원이 달라도 같은 기준으로 비교할 수 있어요.' : '세로축: 도수 — 인원이 많은 집단의 그래프가 전체적으로 크게 그려지기 쉬워요.'}</p></div>
      <div class="scroll"><table class="t"><thead><tr><th>${cat ? esc(s.title) : `계급 (${esc(u)})`}</th><th>${LA} 도수</th><th>${LB} 도수</th><th>${LA} 상대도수</th><th>${LB} 상대도수</th></tr></thead>
        <tbody>${bins.map((b,i) => `<tr><td class="num">${esc(b)}</td><td class="ca">${cA[i]}</td><td class="cb">${cB[i]}</td><td class="ca">${rA[i].toFixed(2)}</td><td class="cb">${rB[i].toFixed(2)}</td></tr>`).join('')}</tbody>
        <tfoot><tr><td>합계</td><td>${nA}</td><td>${nB}</td><td>1</td><td>1</td></tr></tfoot></table></div>
    </div>
    <p class="insight" style="margin-top:14px">${ins}</p>
    <h3>질문: ${qText}</h3>
    <div class="split">
      <div class="rep"><div class="name">도수로 보면</div><div class="big" style="font-size:1.4rem">${LA} ${kA}명 · ${LB} ${kB}명</div><div class="calc">${kA===kB?'같아요':(kA>kB?LA:LB)+'이(가) 더 많아 보여요'}</div></div>
      <div class="rep best"><div class="name">상대도수로 보면</div><div class="big" style="font-size:1.4rem">${LA} ${(kA/nA).toFixed(2)} · ${LB} ${(kB/nB).toFixed(2)}</div><div class="calc">${Math.abs(kA/nA-kB/nB)<1e-9?'비율이 같아요':((kA/nA>kB/nB)?LA:LB)+'의 비율이 더 높아요'} (${fmt(kA/nA*100,1)}% · ${fmt(kB/nB*100,1)}%)</div></div>
    </div>
    <h3>정리</h3>
    <ol class="reasons">
      <li>도수의 총합(전체 인원)이 다른 두 집단은 도수만으로 공정하게 비교하기 어려워요.</li>
      <li>상대도수는 ‘전체 중에서 그 ${cat?'항목':'계급'}이 차지하는 비율’이라서 전체 인원이 달라도 비교할 수 있어요.</li>
      <li>상대도수의 그래프를 한 좌표 위에 함께 그리면 두 집단의 분포를 한눈에 비교할 수 있어요.</li>
    </ol>
  </section>`;
}

function viewRep(){ return isCat(curSurvey()) ? viewRepCat() : viewRepNum(); }
function viewStem(){ return isCat(curSurvey()) ? viewStemCat() : viewStemNum(); }
function viewTable(){ return isCat(curSurvey()) ? viewTableCat() : viewTableNum(); }
function viewGraph(){ return isCat(curSurvey()) ? viewGraphCat() : viewGraphNum(); }
function viewRel(){ return isCat(curSurvey()) ? viewRelCat() : viewRelNum(); }
function catData(s){
  const vals = filtered(s).map(r => String(r.v)); const cats = catOrder(s, vals); const counts = catCounts(cats, vals);
  const used = cats.map((c,i) => ({ c, n:counts[i] }));
  return { vals, cats, counts, used, n: vals.length };
}
function catNote(s){
  return `<section class="card verdict"><div class="eyebrow">이 자료는 수가 아닌 자료예요</div><div class="title">‘${esc(s.title)}’처럼 항목으로 답한 자료</div>
    <p style="margin:6px 0 0">더하거나 크기순으로 늘어놓을 수 없어서 평균·중앙값, 줄기와 잎 그림, 도수분포표(계급), 히스토그램은 쓸 수 없어요. 대신 <b>항목별 도수</b>와 <b>상대도수</b>, <b>최빈값</b>으로 정리해요.</p></section>`;
}
function catChart({ cats, series, rel = false, aria }){
  const W = 720, H = 400, many = cats.length > 8, ml = 58, mr = 16, mt = 26, mb = many ? 84 : 52;
  const ser = series.map(x => ({ ...x, y: x.counts.map(c => rel ? c / (x.total || 1) : c) }));
  const ymaxRaw = Math.max(...ser.flatMap(x => x.y), rel ? 0.05 : 1);
  const st = niceStep(ymaxRaw, rel), ymax = Math.ceil(R(ymaxRaw / st)) * st;
  const Y = v => H - mb - v / ymax * (H - mt - mb);
  const band = (W - ml - mr) / cats.length, inner = band * 0.72, bw = inner / ser.length;
  let g = '';
  for (let t = 0; t <= ymax + 1e-9; t = R(t + st)) g += `<line class="gl" x1="${ml}" x2="${W-mr}" y1="${Y(t)}" y2="${Y(t)}"/><text class="tx" x="${ml-8}" y="${Y(t)+4}" text-anchor="end">${fmt(t,2)}</text>`;
  cats.forEach((c, i) => {
    const x0 = ml + i * band + (band - inner) / 2;
    ser.forEach((x, j) => {
      const y = x.y[i];
      g += `<rect x="${x0 + j*bw}" y="${Y(y)}" width="${Math.max(bw - 2, 1)}" height="${Y(0)-Y(y)}" fill="${x.color}" fill-opacity=".85"/>`;
      if (ser.length === 1 && y > 0) g += `<text class="lbl" x="${x0 + bw/2}" y="${Y(y)-6}" text-anchor="middle">${rel ? fmt(y,2) : y}</text>`;
    });
    const cx = ml + i * band + band / 2;
    g += many ? `<text class="tx" transform="translate(${cx},${H-mb+14}) rotate(-45)" text-anchor="end" font-size="12">${esc(c)}</text>`
              : `<text class="tx" x="${cx}" y="${H-mb+20}" text-anchor="middle">${esc(c)}</text>`;
  });
  g += `<line class="ax" x1="${ml}" x2="${W-mr}" y1="${Y(0)}" y2="${Y(0)}"/><line class="ax" x1="${ml}" x2="${ml}" y1="${mt-8}" y2="${Y(0)}"/>`;
  g += `<text class="tm" x="${ml-6}" y="${mt-12}">${rel ? '(상대도수)' : '(도수)'}</text>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(aria || '막대그래프')}">${g}</svg>`;
}
function viewRepCat(){
  const s = curSurvey(); const D = catData(s); if (!D.n) return emptyCard(s);

      <div class="rep"><div class="name">중앙값<span class="badge bad">구할 수 없음</span></div><div class="big">×</div><div class="calc">어느 항목이 더 큰지 정할 수 없어서 크기순으로 늘어놓을 수 없어요.</div></div>
      <div class="rep best"><div class="name">최빈값<span class="badge good">추천</span></div><div class="big">${modes.length ? modes.map(esc).join(', ') : '없음'}</div><div class="calc">${modes.length ? `${D.n}명 중 ${max}명이 골랐어요` : '모든 항목의 도수가 같아요'}</div></div>
    </div>
  </section>
  <section class="card verdict">
    <div class="eyebrow">이 자료에는</div>
    <div class="title">최빈값을 대푯값으로 써요</div>
    <ol class="reasons">
      <li>‘${esc(s.title)}’은(는) 수량이 아니라 항목으로 답한 자료예요.</li>
      <li>항목은 더할 수도, 크기순으로 늘어놓을 수도 없어서 평균과 중앙값을 구할 수 없어요.</li>
      <li>최빈값은 ‘가장 많이 나타난 값’이라 수가 아닌 자료에도 쓸 수 있어요.${modes.length ? ` 우리 자료의 최빈값은 ${modes.map(esc).join(', ')}이에요.` : ''}</li>
    </ol>
  </section>
  <section class="card"><h2>많이 나온 순서</h2>
    <div class="vals">${top.map((x,i) => `<span class="v ${modes.includes(x.c)?'med':''}">${esc(x.c)} · ${x.n}</span>`).join('')}</div>
  </section>`;
}

  const fid = document.activeElement && document.activeElement.id;
  if (!S.role) { if (S.tab !== 'pin') S.tab = 'roles'; }
  else if (S.role === 'student') { if (S.tab !== shownTab()) S.tab = 'submit'; else applyShown(); }
  else if (S.tab !== 'pin' && !TEACHER_TABS.includes(S.tab)) S.tab = 'data';
  renderTabs(); renderShare(); renderLive(); renderWho();
  if (S.tab === 'roles' || S.tab === 'pin') { $('#banner').innerHTML = ''; $('#toolbar').innerHTML = ''; }
  else { renderBanner(); renderToolbar(); }
  const v = { roles:viewRoles, pin:viewPin, submit:viewSubmit, data:viewData, rep:viewRep, stem:viewStem, table:viewTable, graph:viewGraph, rel:viewRel, admin:viewAdmin }[S.tab] || viewData;
  $('#main').innerHTML = v();
  for (const [id,val] of Object.entries(keep)) { const el = document.getElementById(id); if (el && !el.value && val) el.value = val; }
  if (fid) { const el = document.getElementById(fid); if (el && el.focus) el.focus(); }

}
function setTab(t){ if (S.role === 'student' && t !== 'submit' && t !== shownTab()) return; S.tab = t; if (location.hash.slice(1) !== t) { try { history.replaceState(null,'','#'+t); } catch(e) { location.hash = t; } } render(); window.scrollTo(0,0); }

function parseLines(text, s){
  const cat = s ? isCat(s) : null; const opts = (s && s.options) || []; const groups = (s && s.groups) || [];
  const out = [];
  for (const line of text.split(/\n/)) {
    const toks = line.split(/[,，\t]+|\s+/).map(t => t.trim()).filter(Boolean); if (!toks.length) continue;
    let g = '', sx = ''; const nums = [], strs = [];
    for (const t of toks) {
      const sv = /^(남|남학생|남자)$/.test(t) ? '남' : /^(여|여학생|여자)$/.test(t) ? '여' : '';
      if (sv) { sx = sv; continue; }
      if (/^\d+반$/.test(t) || groups.includes(t)) { g = t; continue; }
      const n = Number(t);
      if (cat !== true && isFinite(n)) { nums.push(n); continue; }
      strs.push(t);
    }
    if (cat === true) strs.forEach(t => { const m = opts.find(o => o.toUpperCase() === t.toUpperCase()); if (m || !opts.length) out.push({ v:m || canon(t), g, s:sx }); });
    else if (cat === false) { if (!g && strs.length) g = strs[0]; nums.forEach(v => out.push({ v, g, s:sx })); }
    else if (nums.length && strs.length === 1 && !g) nums.forEach(v => out.push({ v, g:strs[0], s:sx }));
    else { nums.forEach(v => out.push({ v, g, s:sx })); strs.forEach(t => out.push({ v:canon(t), g, s:sx })); }
  }
  return out;
}

    const raw = $('#ans-val').value; v = Number(raw);
    if (raw === '' || !isFinite(v)) return fail('숫자를 입력해 주세요.');
    if (decOf(v) > d) return fail(d ? `소수 ${d}째 자리까지만 써 주세요.` : '자연수로 써 주세요.');
    if (s.min != null && v < s.min) return fail(`${s.min}${s.unit} 이상으로 써 주세요.`);
    if (s.max != null && v > s.max) return fail(`${s.max}${s.unit} 이하로 써 주세요.`);
  }
  try {
    const ref = S.db.doc('answers/' + S.uid); const snap = await ref.get();
    const body = snap.exists ? { ...snap.data() } : {};
    body[s.id] = { v, g, s:S.submitSex, t:Date.now() };
    await ref.set(body);
    S.submitMsg = { t:`${cat ? v : fmt(v,2) + (s.unit||'')}(으)로 냈어요. 고마워요!` }; if ($('#ans-val')) $('#ans-val').value = ''; render();
  } catch (err) { S.canWrite = false; fail('응답을 저장하지 못했어요. 선생님께 알려 주세요.'); }
});
function applyNvType(){
  const cat = S.nvType === 'category';
  document.querySelectorAll('.only-cat').forEach(el => el.hidden = !cat);
  document.querySelectorAll('.only-num').forEach(el => el.hidden = cat);
}
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (h !== S.tab && ((S.role === 'teacher' && TEACHER_TABS.includes(h)) || (S.role === 'student' && (h === 'submit' || h === shownTab())))) { S.tab = h; render(); } });

/* ---------- 시작 ---------- */
(function start(){
  const h = location.hash.slice(1);
  if (h === 'submit' && S.role !== 'teacher') setRole('student');
  S.tab = S.role === 'teacher' ? (TEACHER_TABS.includes(h) ? h : 'data') : S.role === 'student' ? 'submit' : 'roles';
  render();
  const cfg = window.FIREBASE_CONFIG;
  if (!cfg || !window.firebase) { S.dbState = 'off'; return render(); }
  try { firebase.initializeApp(cfg); } catch (e) { S.dbState = 'off'; return render(); }
  const auth = firebase.auth(); S.auth = auth;
  const teachers = (window.TEACHER_EMAILS || []).map(x => String(x).trim().toLowerCase());
  let attached = false;
  auth.onAuthStateChanged(async u => {
    if (!u) {
      try { await auth.signInAnonymously(); }
      catch (e) { S.authErr = '익명 로그인이 꺼져 있어요. Firebase 콘솔의 Authentication에서 ‘익명’을 사용 설정해 주세요.'; S.dbState = 'off'; render(); }
      return;
    }
    S.uid = u.uid; S.canWrite = true;
    S.authEmail = u.isAnonymous ? null : (u.email || '');
    S.canEdit = !u.isAnonymous && teachers.includes((u.email || '').toLowerCase());
    if (attached) return render();
    attached = true; attach(firebase.firestore());
  });
  function attach(db){
    S.db = db;
    let gotS = false, gotA = false;
    const timer = setTimeout(() => { if (!(gotS && gotA)) { S.dbState = 'slow'; render(); } }, 10000);
    const done = () => {
      if (gotS && gotA && S.dbState !== 'ready') {
        clearTimeout(timer); S.dbState = 'ready';
        const live = liveSurveys();
        if (live.length && S.cur === 'ex-jump') S.cur = live[0].id;
      }
      render();
    };
    db.collection('surveys').onSnapshot(snap => {
      S.surveys = {}; snap.docs.forEach(d => { if (d.exists) S.surveys[d.id] = d.data(); });
      if (!snap.metadata.fromCache) gotS = true; done();
    }, err => { S.dbState = 'error'; render(); });
    db.doc('control/live').onSnapshot(d => {
      S.shown = d.exists ? d.data() : null; render();
    }, () => {});
    db.collection('answers').onSnapshot(snap => {
      S.answers = snap.docs.filter(d => d.exists).map(d => ({ id:d.id, data:d.data() }));
      if (!snap.metadata.fromCache) gotA = true; done();
    }, err => { S.dbState = 'error'; render(); });
  }
})();
</script>
